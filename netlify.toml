[build]
  command = "npm run deploy:build"
  publish = "dist"

[build.environment]
  NPM_FLAGS = "--include=dev"
  VITE_API_BASE_URL = "/api"
  PHAKATHI_STORAGE = "postgres"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."scheduled-notifications"]
  schedule = "0 7,11,14 * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
